<main class="auth-page">
  <div class="auth-container">
    <a class="back-link" routerLink="/products"><span aria-hidden="true">&larr;</span> {{ language.text().backToCollection }}</a>
    <div class="auth-card"><section class="auth-content" aria-labelledby="auth-heading">
      <header class="auth-heading"><a class="auth-brand" routerLink="/products" [attr.aria-label]="language.text().shopHome"><img src="logo.png" width="72" height="72" alt=""/></a><p class="eyebrow">{{ language.text().loginEyebrow }}</p><h1 id="auth-heading">{{ language.text().loginTitle }}</h1><p class="form-intro">{{ language.text().loginIntro }}</p></header>
      <form *ngIf="form" [formGroup]="form" (ngSubmit)="form.markAllAsTouched(); login()">
        <div class="field"><label for="login-username">{{ language.text().emailOrUsername }}</label><input id="login-username" formControlName="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" [placeholder]="language.text().emailOrUsernamePlaceholder" required [attr.aria-invalid]="form.get('username')?.invalid && form.get('username')?.touched ? 'true' : null" [attr.aria-describedby]="form.get('username')?.invalid && form.get('username')?.touched ? 'username-error' : null"/><p *ngIf="form.get('username')?.invalid && form.get('username')?.touched" id="username-error" class="field-error" aria-live="polite">{{ language.text().enterEmailOrUsername }}</p></div>
        <div class="field"><label for="login-password">{{ language.text().password }}</label><div class="password-field"><input id="login-password" formControlName="password" [type]="showPassword ? 'text' : 'password'" autocomplete="current-password" [placeholder]="language.text().password" required [attr.aria-invalid]="form.get('password')?.invalid && form.get('password')?.touched ? 'true' : null" [attr.aria-describedby]="form.get('password')?.invalid && form.get('password')?.touched ? 'password-error' : null"/><button type="button" class="password-toggle" (click)="showPassword = !showPassword" [attr.aria-pressed]="showPassword" [attr.aria-label]="showPassword ? language.text().hidePassword : language.text().showPassword" aria-controls="login-password">{{ showPassword ? language.text().hidePassword : language.text().showPassword }}</button></div><p *ngIf="form.get('password')?.invalid && form.get('password')?.touched" id="password-error" class="field-error" aria-live="polite">{{ language.text().enterPassword }}</p></div>
        <button type="submit" class="submit-button">{{ language.text().login }} <span aria-hidden="true">&rarr;</span></button>
      </form>
      <p class="switch-form">{{ language.text().newToShop }} <a routerLink="/register">{{ language.text().createAccount }}</a></p>
    </section></div>
  </div>
</main>
