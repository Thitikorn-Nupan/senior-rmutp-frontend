<ng-container *ngIf="visible">
  <div class="popup-backdrop" (click)="getCloseEvent()">
    <section class="popup-dialog" role="dialog" aria-modal="true" aria-labelledby="popup-title"
             aria-describedby="popup-body"
             [attr.data-mode]="iconMode" [attr.lang]="language.language()" (click)="$event.stopPropagation()">
      <button (click)="getCloseEvent()" type="button" class="popup-close" [attr.aria-label]="labels.close">
        <span aria-hidden="true">×</span>
      </button>
      <div class="popup-icon" aria-hidden="true">
        <span *ngIf="iconMode === 'WARN'">!</span>
        <span *ngIf="iconMode === 'ERROR'">×</span>
        <span *ngIf="iconMode === 'CONFIRM'">?</span>
        <span *ngIf="iconMode === 'SUCCESS'">✓</span>
      </div>
      <div class="popup-copy">
        <h2 id="popup-title">{{ headerTitle }}</h2>
        <p id="popup-body">{{ body }}</p>
      </div>
      <footer class="popup-actions">
        <button (click)="getCloseEvent()" type="button" class="popup-button secondary">{{ labels.cancel }}</button>
        <button (click)="getOkEvent()" type="button" class="popup-button primary">{{ labels.confirm }}</button>
      </footer>
    </section>
  </div>
</ng-container>
