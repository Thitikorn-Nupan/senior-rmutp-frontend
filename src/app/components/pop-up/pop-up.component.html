<ng-container *ngIf="visible">
  <div class="modal d-block bg-opacity-50 bg-secondary" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true" >
    <div class="modal-dialog" style="margin-top: 400px">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">
            <ng-container *ngIf="iconMode === 'WARN'">
              <i class="fa-solid fa-triangle-exclamation m-lg-2" style="color: #FFD43B;"></i>
            </ng-container>
            <ng-container *ngIf="iconMode === 'ERROR'">
              <i class="fa-solid fa-bug" style="color: #d40237;"></i>
            </ng-container>
            <ng-container *ngIf="iconMode === 'CONFIRM'">
              <i class="fa-solid fa-circle-check" style="color: #63E6BE;"></i>
            </ng-container>
            <ng-container *ngIf="iconMode === 'SUCCESS'">
              <i class="fa-solid fa-circle-check" style="color: #63E6BE;"></i>
            </ng-container>
            {{headerTitle}}
          </h5>
          <button (click)="getCloseEvent()" type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" ></button>
        </div>
        <div class="modal-body">
          {{body}}
        </div>
        <div class="modal-footer">
          <button (click)="getOkEvent()" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Ok</button>
        </div>
      </div>
    </div>
  </div>
</ng-container>
