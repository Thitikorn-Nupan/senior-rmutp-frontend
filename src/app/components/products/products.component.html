<ng-container *ngIf="(productsByPageNumber === undefined) else productsExist">
  <div  class="d-flex justify-content-center">
    <div class="spinner-border mt-3"  role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
</ng-container>
<ng-template #productsExist>
  <!-- Form Search -->
  <ng-container *ngIf="form">
    <div class="form-check form-switch p-8 py-2 mt-4" style="margin: 0 auto;justify-content: center;display: flex;">
      <input (change)="onSwitchMode()" class="form-check-input" type="checkbox" id="flexSwitchCheckDefault" style="cursor: pointer">
      <label class="form-check-label" for="flexSwitchCheckDefault" style="margin-left: 15px;">Standard Search</label>
    </div>
    <ng-container *ngIf="enableForm">
      <form
        [formGroup]="form"
        (ngSubmit)="search()"
        style="margin: 0 auto;width: 350px"
        class="card" id="form1">
        <div class="form-data">
          <div class="input-group">
            <!--<p class="w-100">Search By Perfume Name</p>-->
            <input [formControlName]="'name'"
                   [placeholder]="'Search by name'"
                   type="text"
                   id="name"
                   class="form-control rounded-start-3"
                   autocomplete="off"/>
            <button type="submit" class="btn btn-secondary">Search</button>
            <button type="reset" class="btn btn-secondary" (click)="clear()">Clear</button>
          </div>
        </div>
      </form>
    </ng-container>
  </ng-container>
  <!-- Card -->
  <div class="row row-cols-1 row-cols-sm-3 g-3 " style="margin: 0 auto;width: 1245px">
    <ng-container  *ngFor="let product of productsByPageNumber">
      <div  class="col p-3 " >
        <div class="card text-bg-secondary mb-3 shadow-sm "  >
          <div class="product-box">
            <img class="img-fluid p-3" [src]="product.imageUrl" style="width: 455px;height: 375px" alt="">
          </div>
          <div class="card-body">
            <h1>{{ product.sku }}</h1>
            <p class="card-text">{{ product.name }}</p>
            <div class="d-flex justify-content-between align-items-center">
              <div class="btn-group">
                <button type="button" (click)="seeDetail(product.pid)" class="btn btn-sm btn btn-light btn-custom">Detail</button>
                <button type="button" (click)="addItem(product)" class="btn btn-sm btn btn-light btn-custom">Add to cart</button>
              </div>
              <small class="price">{{ product.price | currency : 'THB' }}</small>
              <small class="badge bg-white text-secondary position-relative">Stock {{ product.unitInStock }} Pcs.
                <span class="position-absolute top-0 start-100 translate-middle p-2 bg-success border border-light rounded-circle">
                  <span class="visually-hidden">New alerts</span>
                </span>
              </small>
            </div>
          </div>
        </div>
      </div>
    </ng-container>
  </div>
  <!-- Pagination -->
  <div class="">
    <ng-container *ngIf="productsByPageNumber">
      <div class="mt-4 container ">
        <nav aria-label="...">
          <ul class="pagination justify-content-end mx-5 ">
            <li class="page-item {{pageSelected === 1 ? 'disabled' : 'cursor-pointer'}}">
              <button class="page-link btn-custom {{pageSelected !== 1 ? 'bg-secondary' : 'bg-secondary-subtle'}}"
                      (click)="onUpdatePagePagination('P')"
                      style="color: white">
                      Previous
              </button>
            </li>
            <ng-container *ngFor="let page of getTotalPageNumberAsArray();">
              <li class="page-item {{page === pageSelected ? 'active' : ''}}" style="cursor: pointer">
                <button class="page-link bg-secondary btn-custom" (click)="setPageNumberSelect(page)" style="color: white">{{page}}</button>
              </li>
            </ng-container>
            <li class="page-item {{pageSelected == getTotalPageNumberAsArray().length ? 'disabled' : 'cursor-pointer'}}">
              <button class="page-link btn-custom {{pageSelected !== getTotalPageNumberAsArray().length ? 'bg-secondary' : 'bg-secondary-subtle'}}"
                      (click)="onUpdatePagePagination('N')"
                      style="color: white;">
                      Next
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </ng-container>
  </div>

</ng-template>
