<div
  class="alert-region"
  role="status"
  aria-live="polite"
  aria-atomic="true"
  [attr.lang]="language.language()">
  <section
    *ngIf="alerts.currentAlert() as alert"
    class="app-alert"
    [attr.data-status]="alert.status">
    <span class="status-icon" aria-hidden="true">{{ icons[alert.status] }}</span>
    <div class="alert-content">
      <strong class="alert-header">{{ alert.header }}</strong>
      <p class="alert-detail">{{ alert.detail }}</p>
    </div>
    <div class="alert-actions">
      <button
        type="button" (click)="alerts.toggleSound()"
        [attr.aria-pressed]="alerts.soundEnabled()"
        [attr.aria-label]="language.language() === 'th' ? 'เสียงแจ้งเตือน' : 'Notification sound'"
        [attr.title]="language.language() === 'th' ? 'เปิด/ปิดเสียงแจ้งเตือน' : 'Toggle notification sound'">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4Z" stroke-linejoin="round"/>
          <path *ngIf="alerts.soundEnabled()" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" stroke-linecap="round"/>
          <path *ngIf="!alerts.soundEnabled()" d="m16 9 6 6m0-6-6 6" stroke-linecap="round"/>
        </svg>
      </button>
      <button
        type="button"
        (click)="alerts.dismiss()"
        [attr.aria-label]="language.language() === 'th' ? 'ปิดการแจ้งเตือน' : 'Dismiss notification'">
        <span aria-hidden="true">×</span>
      </button>
    </div>
  </section>
</div>
