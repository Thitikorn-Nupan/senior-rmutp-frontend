<nav class="account-links" aria-label="Your account">
  <ng-container *ngIf="!isUserLogin">
    <a routerLink="/login" routerLinkActive="current">Login</a>
    <a routerLink="/register" class="register-link" routerLinkActive="current">Create account</a>
  </ng-container>
  <div *ngIf="user?.roles === 'ROLE_ADMIN' && isAdminLogin" class="management">
    <button type="button" (click)="toggle()" [attr.aria-expanded]="isToggle" aria-controls="management-menu">Manage
      products <span aria-hidden="true">⌄</span></button>
    <ul *ngIf="isToggle" id="management-menu" class="management-menu" (keydown.escape)="isToggle = false">
      <li><a routerLink="/orders-history-admin" (click)="toggle()">Sales history</a></li>
      <li><a routerLink="/product-admin" (click)="toggle()">Manage perfumes</a></li>
      <li><a routerLink="/add-product" (click)="toggle()">Add perfume</a></li>
    </ul>
  </div>
  <ng-container *ngIf="isUserLogin || isAdminLogin">
    <a routerLink="/orders-history" routerLinkActive="current">Orders history</a>
    <button type="button" (click)="logout()">Logout</button>
  </ng-container>
</nav>
