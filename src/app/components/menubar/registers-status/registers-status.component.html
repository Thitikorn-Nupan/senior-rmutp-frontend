<nav class="account-links" [class.guest-links]="!isUserLogin" [attr.aria-label]="menuLanguage.text().account">
  <ng-container *ngIf="!isUserLogin">
    <a routerLink="/login"
       routerLinkActive="current">
      {{ menuLanguage.text().login }}
    </a>
    <a routerLink="/register"
       class="register-link"
       routerLinkActive="current">
      {{ menuLanguage.text().createAccount }}
    </a>
  </ng-container>
  <div *ngIf="user?.roles === 'ROLE_ADMIN' && isAdminLogin" class="management">
    <button class="management-toggle"
            type="button" (click)="toggle()"
            [attr.aria-expanded]="isToggle"
            aria-controls="management-menu">
      <span>
        {{ menuLanguage.text().manageProducts }}
      </span>
      <svg class="management-chevron"
           width="18"
           height="18"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="1.8" aria-hidden="true" focusable="false">
        <path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <ul *ngIf="isToggle" id="management-menu" class="management-menu" (keydown.escape)="isToggle = false">
      <li><a routerLink="/orders-history-admin" (click)="toggle()">{{ menuLanguage.text().salesHistory }}</a></li>
      <li><a routerLink="/product-admin" (click)="toggle()">{{ menuLanguage.text().managePerfumes }}</a></li>
      <li><a routerLink="/add-product" (click)="toggle()">{{ menuLanguage.text().addPerfume }}</a></li>
    </ul>
  </div>
  <ng-container *ngIf="isUserLogin || isAdminLogin">
    <a routerLink="/orders-history" routerLinkActive="current">{{ menuLanguage.text().ordersHistory }}</a>
    <button type="button"
            (click)="logout()">
      {{ menuLanguage.text().logout }}
    </button>
  </ng-container>
  <button type="button"
          class="language-toggle"
          (click)="menuLanguage.toggleLanguage()"
          [attr.aria-label]="menuLanguage.text().switchLanguage"
          [attr.title]="menuLanguage.text().switchLanguage"
          [attr.lang]="menuLanguage.language() === 'th' ? 'en' : 'th'">
    {{ menuLanguage.language() === 'th' ? 'EN' : 'ไทย' }}
  </button>
</nav>
