<header class="shop-header">
  <div class="header-inner">
    <a class="shop-brand" routerLink="/products" aria-label="Perfumes Shop home">
      <img src="logo.png" width="40" height="40" alt="" />
      <span>Perfumes Shop<small>Find your signature scent</small></span>
    </a>
    <ecm-registers-status class="account-nav"></ecm-registers-status>
    <ecm-cart-status class="cart-nav"></ecm-cart-status>
    <ecm-product-categories class="category-nav"></ecm-product-categories>
  </div>
  <section *ngIf="user" class="session-info" aria-label="Your login session">
    <div class="session-user">
      <span class="user-icon" aria-hidden="true">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="8" r="3.5" />
          <path d="M5 21v-2a7 7 0 0 1 14 0v2" stroke-linecap="round" />
        </svg>
      </span>
      <div class="user-details">
        <span class="session-label">Welcome back</span>
        <strong class="session-name">{{ user.username }}</strong>
      </div>
    </div>
    <span class="session-badge"><span class="session-dot" aria-hidden="true"></span>Signed in</span>
    <div *ngIf="tokenExpire" class="session-expiry">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div>
        <span class="session-label">Session expires</span>
        <span class="expiry-value">{{ tokenExpire * 1000 | date:'dd MMM yyyy, HH:mm' }}</span>
      </div>
    </div>
  </section>
</header>
