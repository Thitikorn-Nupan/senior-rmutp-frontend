<ng-container *ngIf="productCategories">
  <nav class="nav nav-masthead justify-content-center float-md-end">
    <ng-container *ngFor="let productCategory of productCategories">
      <!-- way to pass path param on router link -->
      <a [routerLink]="['category',productCategory.pcId]" class="nav-link fw-bold py-1 px-0 p-lg-2" >{{productCategory.categoryName}}</a>
    </ng-container>
  </nav>
</ng-container>
