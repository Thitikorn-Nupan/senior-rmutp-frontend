<ng-container *ngIf="(orderHistoriesAdmin === undefined) else orderHistoriesAdminExist">
  <div class="d-flex justify-content-center">
    <div class="spinner-border mt-3" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
</ng-container>

<ng-template #orderHistoriesAdminExist>
  <div class="container mt-1">
    <div class="section-content section-content-p30">
      <div class="container-fluid"  style="width: fit-content;margin: 0 auto">
        <ng-container *ngIf="orderHistoriesAdmin">
          <h3 class="mb-4">Perfumes Sold Out History
            <button class="btn btn-danger rounded-circle m-lg-4" (click)="onDownloadSoldOutPdf()">
              <ng-container *ngIf="!isLoadingFilePdf">
                <i class="fa-sharp-duotone fa-solid fa-file-pdf"></i>
              </ng-container>
              <ng-container *ngIf="isLoadingFilePdf">
                <span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>
                <span class="visually-hidden">Loading...</span>
              </ng-container>
            </button>
            <button class="btn btn-success rounded-circle" (click)="onDownloadSoldOutExcel()">
              <ng-container *ngIf="!isLoadingFileExcel">
                <i class="fa-sharp-duotone fa-solid fa-file-excel"></i>
              </ng-container>
              <ng-container *ngIf="isLoadingFileExcel">
                <span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>
                <span class="visually-hidden">Loading...</span>
              </ng-container>
            </button>
          </h3>

          <table class="table table-bordered overflow-auto"  style="max-height: 110vh;width: fit-content;margin: 0 auto;height: 680px;display: block;" >
            <tbody class="text-center">
            <tr class="table table-secondary">
              <th>Sku</th>
              <th>Name</th>
              <th>Image </th>
              <th>Quantity</th>
              <th>Price</th>
            </tr>
            <tr *ngFor="let order of orderHistoriesAdmin;">
              <td>
                {{ order.sku }}
              </td>
              <td>
                {{ order.name }}
              </td>
              <td>
                <img [src]="order.imageUrl" style="width: 50px; height: 50px;">
              </td>
              <td>
                {{ order.quantity }}
              </td>
              <td>
                {{ order.price | currency : "THB" }}
              </td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
              <td colspan="11" class="text-center">
                <p class="mt-3">Total Sale Out : {{ getTotalPrice() | currency : "THB" }}</p>
              </td>
            </tr>
            </tfoot>
          </table>
        </ng-container>
      </div>
    </div>
  </div>
</ng-template>

<pop-up
  [visible]="visible"
  [headerTitle]="headerTitle"
  [iconMode]="iconMode"
  [body]="body"
  (closeEvent)="setCloseEvent()"
  (okEvent)="setOkEvent()">
</pop-up>
