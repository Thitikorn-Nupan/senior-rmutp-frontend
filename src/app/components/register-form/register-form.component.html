<ng-container *ngIf="form">
  <div class="container mt-4" style="margin: 0 auto; ">
    <div class="container-fluid " style="margin-top: 20px;">
      <form [formGroup]="form"
            (ngSubmit)="signIn()"
            class="form-area w-50" style="margin: 250px auto;">
      <h3>Sign In</h3>
        <div class="row m-lg-4">
          <div class="col-md-3">
            <label>
              <label *ngIf="form.get('username')?.hasError('required') && form.get('username')?.touched" class="text-danger">
                *
              </label>
              Email
            </label>
          </div>
          <div class="col-md-8">
            <div class="input-space">
              <input [formControlName]="'username'"
                     class="form-control rounded-5"
                     style="border-width: 1px;border-style: solid;border-color: #c6c6c6;"
                     type="email"
                     placeholder="email..."
                     id="email"/>
            </div>
          </div>
        </div>

        <div class="row m-lg-4">
          <div class="col-md-3">
            <label>
              <label *ngIf="form.get('password')?.hasError('required') && form.get('password')?.touched" class="text-danger">
                *
              </label>
              Password
            </label>
          </div>
          <div class="col-md-8">
            <div class="input-space">
              <input [formControlName]="'password'"
                     class="form-control rounded-5"
                     style="border-width: 1px;border-style: solid;border-color: #c6c6c6;"
                     type="password"
                     placeholder="password..."
                     id="password">
            </div>
          </div>
        </div>

        <div class="row m-lg-4">
          <div class="col-md-12">
            <button type="submit" class="btn btn-secondary w-100">Sign In</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</ng-container>

<pop-up
  [visible]="visible"
  [headerTitle]="headerTitle"
  [iconMode]="iconMode"
  [body]="body"
  (closeEvent)="setCloseEvent()"
  (okEvent)="setOkEvent()">
</pop-up>
