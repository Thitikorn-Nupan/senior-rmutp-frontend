<button
  type="button"
  class="select-trigger"
  role="combobox" [id]="inputId"
  [disabled]="isDisabled"
  [class.expanded]="open" [class.invalid]="invalid" [class.placeholder]="!value"
  [attr.aria-expanded]="open" aria-haspopup="listbox" [attr.aria-controls]="open ? inputId + '-listbox' : null"
  [attr.aria-activedescendant]="open ? inputId + '-option-' + activeIndex : null"
  [attr.aria-required]="required" [attr.aria-invalid]="invalid ? 'true' : null" [attr.aria-describedby]="describedBy"
  (click)="toggle()" (keydown)="keydown($event)" (blur)="blur()">
  <span>{{ value || placeholder }}</span>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
       aria-hidden="true">
    <path d="m7 10 5 5 5-5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
<div *ngIf="open" class="select-menu" [class.above]="above">
  <div #listbox class="select-options" role="listbox" [id]="inputId + '-listbox'" [attr.aria-label]="placeholder">
    <div *ngFor="let option of options; let index = index" class="select-option" role="option"
         [id]="inputId + '-option-' + index" [attr.aria-selected]="option.name === value"
         [class.active]="index === activeIndex" [class.selected]="option.name === value"
         (pointerdown)="$event.preventDefault()" (click)="choose(index)">
      <span>{{ option.name }}</span>
      <svg *ngIf="option.name === value" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" aria-hidden="true">
        <path d="m5 12 4 4L19 6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</div>
